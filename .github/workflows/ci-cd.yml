
name: GoalZone Full CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: msaeedkhan40
          password: ${{ secrets.DOCKERHUB_MSAEEDKHAN40 }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: msaeedkhan40/goalzone-frontend:latest

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: msaeedkhan40/goalzone-backend:latest

  deploy:
    needs: build-and-push
    runs-on: self-hosted

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Deploy GoalZone
        run: |
          for i in 1 2 3; do
            if docker compose pull; then
              break
            fi

            if [ "$i" -eq 3 ]; then
              exit 1
            fi

            echo "Pull failed. Retrying in 15 seconds..."
            sleep 15
          done

          docker compose up -d --remove-orphans

      - name: Check running containers
        run: docker compose ps
