services:
  frontend:
    image: msaeedkhan40/goalzone-frontend:latest
    container_name: goalzone-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    image: msaeedkhan40/goalzone-backend:latest
    container_name: goalzone-backend
    ports:
      - "5000:5000"
    volumes:
      - goalzone_data:/app/data
    restart: unless-stopped

volumes:
  goalzone_data:
